<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1600px; height: 640px; overflow: hidden; background: #10140f; }
    body {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: #f4f6f1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 64px 72px;
    }
    .kicker {
      color: #76b900;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    h1 {
      margin-top: 18px;
      font-size: 68px;
      line-height: 0.98;
      font-weight: 700;
      letter-spacing: -0.03em;
      max-width: 820px;
    }
    .sub {
      margin-top: 22px;
      font-size: 28px;
      color: #d5ddcc;
    }
    .model {
      margin-top: 28px;
      display: inline-block;
      padding: 10px 14px;
      border: 1px solid #2c3824;
      border-radius: 8px;
      color: #b7c4a4;
      font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
      font-size: 18px;
    }
    .page {
      width: 420px;
      height: 500px;
      background: #f7f8f4;
      color: #1c2418;
      border-radius: 18px;
      padding: 28px 28px 24px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    }
    .bar {
      height: 10px;
      width: 120px;
      background: #1c4a30;
      border-radius: 99px;
      margin-bottom: 22px;
    }
    .doc-kicker { font-size: 13px; letter-spacing: 0.14em; color: #5d6b56; font-weight: 700; }
    .doc-title { margin-top: 8px; font-size: 28px; font-weight: 700; }
    .doc-id { margin-top: 6px; font-size: 18px; color: #1c4a30; font-weight: 700; }
    table { width: 100%; margin-top: 28px; border-collapse: collapse; font-size: 16px; }
    th { text-align: left; color: #5d6b56; font-weight: 600; padding-bottom: 8px; }
    td { padding: 8px 0; border-top: 1px solid #e1e6da; }
    .right { text-align: right; }
    .total {
      margin-top: 22px;
      background: #1c4a30;
      color: #f4f6f1;
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: 700;
    }
    .total span:last-child { color: #b6d264; }
  </style>
</head>
<body>
  <div>
    <div class="kicker">Document intelligence showcase</div>
    <h1>Nemotron 3.5 Super VL</h1>
    <p class="sub">Read the page. Return the record.</p>
    <div class="model">nvidia/nemotron-3.5-super-vl-120b-a12b</div>
  </div>
  <div class="page">
    <div class="bar"></div>
    <div class="doc-kicker">TAX INVOICE</div>
    <div class="doc-title">Harbour &amp; Co.</div>
    <div class="doc-id">INV-20418</div>
    <table>
      <thead>
        <tr><th>Item</th><th class="right">Amount</th></tr>
      </thead>
      <tbody>
        <tr><td>Field notebook</td><td class="right">444.00</td></tr>
        <tr><td>Plotter pen, black</td><td class="right">252.00</td></tr>
      </tbody>
    </table>
    <div class="total"><span>Total ZAR</span><span>800.40</span></div>
  </div>
</body>
</html>
